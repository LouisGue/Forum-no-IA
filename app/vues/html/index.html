<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forum</title>
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/buttons.css">
    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/style.css">

</head>
<body>
    <nav class="navbar">
        <button class="btn">Accueil</button>
        
        <div class="navbar_links">
            <a class="btn btn--secondary btn--arrow" href="#">
                My posts
                <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24">
                    <path d="M0 0h24v24H0z" fill="none" />
                    <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                        <path stroke-dasharray="64" stroke-width="2" d="M13 3l6 6v12h-14v-18h8">
                            <animate fill="freeze" attributeName="stroke-dashoffset" dur="0.6s" values="64;0" />
                        </path>
                        <path stroke-dasharray="14" stroke-dashoffset="14" d="M12.5 3v5.5h6.5">
                            <animate fill="freeze" attributeName="stroke-dashoffset" begin="0.7s" dur="0.2s" to="0" />
                        </path>
                    </g>
                </svg>
            </a>
            <a class="btn btn--secondary btn--arrow" href="#">
                New post
                <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24">
                    <path d="M0 0h24v24H0z" fill="none" />
                    <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
                        <path stroke-dasharray="44" stroke-dashoffset="44" d="M7 17v-4l10 -10l4 4l-10 10h-4">
                            <animate fill="freeze" attributeName="stroke-dashoffset" begin="0.3s" dur="0.5s" to="0" />
                        </path>
                        <path stroke-dasharray="20" d="M3 21h18">
                            <animate fill="freeze" attributeName="stroke-dashoffset" dur="0.3s" values="20;0" />
                        </path>
                        <path stroke-dasharray="8" stroke-dashoffset="8" d="M14 6l4 4">
                            <animate fill="freeze" attributeName="stroke-dashoffset" begin="0.8s" dur="0.2s" to="0" />
                        </path>
                    </g>
                </svg>
            </a>
            <a class="btn btn--secondary btn--arrow" href="#">
                My account
                <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24">
                    <path d="M0 0h24v24H0z" fill="none" />
                    <g fill="none" stroke="currentColor" stroke-dasharray="28" stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
                        <path d="M4 21v-1c0 -3.31 2.69 -6 6 -6h4c3.31 0 6 2.69 6 6v1">
                            <animate fill="freeze" attributeName="stroke-dashoffset" dur="0.4s" values="28;0" />
                        </path>
                        <path stroke-dashoffset="28" d="M12 11c-2.21 0 -4 -1.79 -4 -4c0 -2.21 1.79 -4 4 -4c2.21 0 4 1.79 4 4c0 2.21 -1.79 4 -4 4Z">
                            <animate fill="freeze" attributeName="stroke-dashoffset" begin="0.4s" dur="0.4s" to="0" />
                        </path>
                    </g>
                </svg>
            </a>
        </div>
    </nav>
</body>
</html>
